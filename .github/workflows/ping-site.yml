name: Ping site

# Tells the private site repo to re-sync after the README changes on main.
# Never runs on pull requests, so unreviewed edits cannot reach the site.
on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set, skipping"; exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nishaj0/claude-for-everything-site/dispatches \
            -d '{"event_type":"list-updated"}'
